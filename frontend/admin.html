<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - InsightNews</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
  <!-- Tailwind Config & Application Logic -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: {
              red: '#DC2626',
              darkRed: '#B91C1C',
              navy: '#0F172A',
              slate: '#1E293B'
            }
          }
        }
      }
    }
  </script>
  <script src="admin.js"></script>
</head>
<body class="bg-gray-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <!-- TOP BAR -->
  <div class="bg-brand-navy text-white">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="flex items-center space-x-2 group">
        <div class="bg-red-600 text-white font-extrabold text-xl px-2.5 py-1 rounded shadow group-hover:bg-red-700 transition">IN</div>
        <div>
          <span class="text-xl font-black tracking-tight">INSIGHT<span class="text-red-600">NEWS</span></span>
          <span class="ml-2 text-[10px] font-bold bg-amber-400 text-slate-900 px-2 py-0.5 rounded uppercase tracking-wider align-middle">Admin</span>
        </div>
      </a>
      <div class="flex items-center space-x-3 text-xs">
        <a href="/" class="text-slate-300 hover:text-white transition"><i class="fas fa-arrow-left mr-1"></i> View Site</a>
        <button id="logout-btn" onclick="logout()" class="hidden bg-slate-800 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg transition">
          <i class="fas fa-sign-out-alt mr-1"></i> Log out
        </button>
      </div>
    </div>
  </div>

  <!-- LOGIN GATE -->
  <main id="login-view" class="flex-1 flex items-center justify-center px-4 py-16">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-lg border border-gray-200 p-8">
      <div class="text-center mb-6">
        <div class="inline-flex bg-red-50 text-red-600 w-14 h-14 rounded-full items-center justify-center text-2xl mb-3">
          <i class="fas fa-lock"></i>
        </div>
        <h1 class="text-xl font-extrabold text-slate-900">Newsroom Access</h1>
        <p class="text-xs text-gray-500 mt-1">Enter the admin token to manage articles.</p>
      </div>
      <form onsubmit="login(event)" class="space-y-3">
        <input type="password" id="token-input" required placeholder="Admin token"
          class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-transparent">
        <button type="submit" id="login-btn"
          class="w-full bg-red-600 hover:bg-red-700 text-white text-sm font-bold py-2.5 rounded-lg transition uppercase tracking-wider">
          Sign In
        </button>
      </form>
      <p id="login-error" class="hidden mt-3 text-xs text-red-600 text-center font-semibold"></p>
    </div>
  </main>

  <!-- DASHBOARD -->
  <main id="dashboard-view" class="hidden flex-1 w-full max-w-7xl mx-auto px-4 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">

      <!-- ARTICLE FORM -->
      <section class="lg:col-span-2">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 lg:sticky lg:top-6">
          <h2 id="form-title" class="text-lg font-bold text-slate-900 flex items-center space-x-2 border-b-2 border-red-600 pb-3 mb-5">
            <span class="w-3 h-6 bg-red-600 rounded-sm"></span>
            <span>Create New Article</span>
          </h2>

          <form id="article-form" onsubmit="submitArticle(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Headline *</label>
              <input type="text" id="f-title" required placeholder="Article headline"
                class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-600">
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Category *</label>
                <select id="f-category" required
                  class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-red-600"></select>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Author</label>
                <input type="text" id="f-author" placeholder="Insight Desk"
                  class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-600">
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Summary *</label>
              <textarea id="f-summary" required rows="3" placeholder="Short preview shown on cards (1-2 sentences)"
                class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-600"></textarea>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Image URL</label>
              <input type="url" id="f-image" placeholder="https://... (leave blank for default image)"
                class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-600">
              <img id="f-image-preview" src="" alt="" class="hidden mt-2 w-full h-32 object-cover rounded-lg border border-gray-200">
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                Story content *
                <span class="normal-case font-normal text-gray-400">(HTML allowed, e.g. &lt;p&gt;paragraph&lt;/p&gt;)</span>
              </label>
              <textarea id="f-content" required rows="10" placeholder="<p>Full article body...</p>"
                class="w-full px-3 py-2 text-sm font-mono border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-600"></textarea>
            </div>

            <div class="flex items-center gap-6 pt-1">
              <label class="flex items-center space-x-2 text-xs font-semibold text-slate-700 cursor-pointer">
                <input type="checkbox" id="f-lead" class="w-4 h-4 accent-red-600">
                <span><i class="fas fa-star text-amber-500 mr-1"></i> Lead story (hero)</span>
              </label>
              <label class="flex items-center space-x-2 text-xs font-semibold text-slate-700 cursor-pointer">
                <input type="checkbox" id="f-featured" class="w-4 h-4 accent-red-600">
                <span><i class="fas fa-thumbtack text-red-500 mr-1"></i> Featured</span>
              </label>
            </div>

            <div id="form-msg" class="hidden text-xs font-semibold rounded-lg px-3 py-2"></div>

            <div class="flex gap-3 pt-2">
              <button type="submit" id="submit-btn"
                class="flex-1 bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-2.5 rounded-lg transition uppercase tracking-wider">
                <i class="fas fa-paper-plane mr-1"></i> Publish Article
              </button>
              <button type="button" id="cancel-edit-btn" onclick="resetForm()" class="hidden bg-gray-200 hover:bg-gray-300 text-slate-700 text-xs font-bold py-2.5 px-4 rounded-lg transition">
                Cancel
              </button>
            </div>
          </form>
        </div>
      </section>

      <!-- ARTICLE LIST -->
      <section class="lg:col-span-3">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
          <div class="flex items-center justify-between border-b-2 border-slate-900 pb-3 mb-4">
            <h2 class="text-lg font-bold text-slate-900 flex items-center space-x-2">
              <span class="w-3 h-6 bg-slate-900 rounded-sm"></span>
              <span>Published Articles</span>
            </h2>
            <div class="flex items-center gap-3">
              <span id="list-count" class="text-xs text-gray-500 font-medium"></span>
              <button onclick="loadArticlesList()" class="text-xs text-red-600 hover:text-red-800 font-semibold transition">
                <i class="fas fa-rotate mr-1"></i> Refresh
              </button>
            </div>
          </div>

          <div id="articles-list" class="space-y-3">
            <div class="text-center py-10 text-gray-400 text-sm">
              <i class="fas fa-circle-notch fa-spin text-2xl mb-2 block"></i>
              Loading articles...
            </div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- FOOTER STRIP -->
  <footer class="bg-brand-navy text-slate-400 text-[11px] py-4 mt-8">
    <div class="max-w-7xl mx-auto px-4 text-center">
      InsightNews Admin Console &copy; 2026 &mdash; authorized editorial staff only
    </div>
  </footer>

</body>
</html>
